// Run device tests in an isolated application, never against the user's installed database.
gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.plugins.withId('com.android.application') {
            project.androidComponents.finalizeDsl { android ->
                android.defaultConfig.applicationId = 'com.example.spendtracker.verification'
                android.defaultConfig.testApplicationId = 'com.example.spendtracker.verification.test'
                android.defaultConfig.testInstrumentationRunnerArguments['class'] = [
                    'com.example.spendtracker.ui.dashboard.DashboardChartsDeviceTest',
                    'com.example.spendtracker.di.PredictionInsightsMigrationTest',
                    'com.example.spendtracker.di.AnalyticsMaterializationTest'
                ].join(',')
            }
        }
    }
}
